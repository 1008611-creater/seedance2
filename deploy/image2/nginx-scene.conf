server {
    listen 80;
    server_name scene.lsb0713.online picture.lsb0713.online;

    client_max_body_size 30M;

    location = /image2-cases {
      return 308 https://image2.lsb0713.online$request_uri;
    }

    location ^~ /image2-cases/ {
      return 308 https://image2.lsb0713.online$request_uri;
    }

    location = /admin/image2-cases {
      return 308 https://image2.lsb0713.online$request_uri;
    }

    location ^~ /admin/image2-cases/ {
      return 308 https://image2.lsb0713.online$request_uri;
    }

    location = /video-studio {
      return 308 https://image2.lsb0713.online$request_uri;
    }

    location ^~ /video-studio/ {
      return 308 https://image2.lsb0713.online$request_uri;
    }

    location ^~ /_next/static/ {
      proxy_pass http://image2-scene:3000;
      include proxy.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /api/image2/output/ {
      proxy_pass http://image2-scene:3000;
      include proxy.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
      proxy_pass http://image2-scene:3000;
      include proxy.conf;
    }
}
