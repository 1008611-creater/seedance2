services:
  image2-scene:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_IMAGE2_LINK_SITE_URL: ${NEXT_PUBLIC_IMAGE2_LINK_SITE_URL:-https://image2.lsb0713.online}
    image: image2-scene:latest
    container_name: image2-scene
    restart: unless-stopped
    env_file:
      - ./deploy/image2/production.env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      APP_URL: https://picture.lsb0713.online
      DAIHUO_OUTPUT_ROOT: /data/daihuo-output
      IMAGE2_ASSET_SYNC_BACKEND: supabase
      IMAGE2_GACHA_BACKEND: supabase
      IMAGE2_GACHA_PACK_DRAW_COUNT: "2"
      IMAGE2_WORKBENCH_STORAGE_BACKEND: supabase
      NEXT_PUBLIC_IMAGE2_LINK_SITE_URL: ${NEXT_PUBLIC_IMAGE2_LINK_SITE_URL:-https://image2.lsb0713.online}
    ports:
      - "127.0.0.1:3052:3000"
    volumes:
      - image2_daihuo_output:/data/daihuo-output
    networks:
      - docker_default

volumes:
  image2_daihuo_output:

networks:
  docker_default:
    external: true
    name: docker_default
